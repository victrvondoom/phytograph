[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanasignal"
version = "0.1.0"
description = "VanaSignal: biodiversity occurrence-gap and survey-priority analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pandas>=2.2",
  "numpy>=1.26",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "h3>=4.1,<5",
  "scikit-learn>=1.4",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[tool.setuptools.packages.find]
include = ["vanasignal*"]

[tool.setuptools.package-data]
vanasignal = []
